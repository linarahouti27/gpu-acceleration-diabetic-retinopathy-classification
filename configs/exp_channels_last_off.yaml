seed: 42
data:
  split_seed: 42
  root: data/dr_dataset
  image_size:
  - 224
  - 224
  num_classes: 5
  train_frac: 0.7
  val_frac: 0.15
  batch_size: 32
  num_workers: 2
  cache_dir: data/cache
  prefetch_factor: 2
  prefetch_gpu: true
preprocess:
  gpu: true
  clahe: true
  circular_crop: true
  normalize: true
  gamma: 1.0
  augment: false
train:
  model: resnet18
  epochs: 5
  lr: 0.0001
  amp: true
  channels_last: false
  compile: false
  weight_decay: 0.0
  label_smoothing: 0.0
