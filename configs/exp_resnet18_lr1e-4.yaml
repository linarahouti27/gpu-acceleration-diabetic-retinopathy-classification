# A6.8 / A6.9 experiment: exp_resnet18_lr1e-4
# Compared with: exp_resnet18
# One change:    train.lr: 0.001 -> 0.0001
# Hypothesis:    Fine-tuning a pretrained network with a smaller learning rate keeps its ImageNet knowledge.
# Same splits (split_seed 42) and training budget (5 epochs) as every other experiment.
seed: 42
data:
  split_seed: 42          # fixed in every experiment: identical train/val/test images
  root: data/dr_dataset
  image_size: [224, 224]
  num_classes: 5
  train_frac: 0.70
  val_frac: 0.15
  batch_size: 32
  num_workers: 2
preprocess:
  clahe: true
  circular_crop: true
  normalize: true
  gamma: 1.0
train:
  model: resnet18
  epochs: 5
  lr: 0.0001
  amp: false
  weight_decay: 0.0
  label_smoothing: 0.0
