# Optimized configuration (A6.8): configs/baseline.yaml with every optimization switched on.
# Same model (reference CNN), seed, splits, image size, training budget and recipe as the
# baseline, so the comparison with it measures only the optimizations (A6.10, device and
# optimization effect). The best model for quality is a separate config (ResNet-18).
# Ablation (A7.6): configs/exp_<name>_off.yaml = this file with ONE optimization switched off.
seed: 42
data:
  split_seed: 42            # fixed: identical train/val/test images in every run
  root: data/dr_dataset
  image_size: [224, 224]
  num_classes: 5
  train_frac: 0.70
  val_frac: 0.15
  batch_size: 32            # TODO(A6.7): update after P1's batch-size tuning
  num_workers: 2            # TODO(A5.8): update after P1's workers sweep
  cache_dir: data/cache     # A3: decoded uint8 cache (P1's A3.5: loading ~1000x faster)
  prefetch_factor: 2        # A5.1: batches each worker keeps ready
  prefetch_gpu: true        # A5.2, A5.5: overlap the host-to-device copy with compute
preprocess:
  gpu: true                 # A4, A5.3: batched preprocessing on the GPU, uint8 copy (A4.14)
  clahe: true
  circular_crop: true
  normalize: true
  gamma: 1.0
  augment: false            # same as the baseline
train:
  model: reference_cnn      # same model as the baseline (speed comparison)
  epochs: 5
  lr: 0.001
  amp: true                 # A6.1: mixed precision
  channels_last: true       # A6.2: measured with AMP: 1.75x on Colab (P3)
  compile: false            # A6.3: torch.compile needs Triton, not available on Windows
  weight_decay: 0.0
  label_smoothing: 0.0
